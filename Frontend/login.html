<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | LogiTrack</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <!-- Puedes reemplazar esto con un SVG de tu logo más adelante -->
            <h1>📦 LogiTrack</h1>
            <p>Sistema de Gestión y Auditoría de Bodegas</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="admin@logitrack.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="•••••" required autocomplete="current-password">
            </div>
            
            <button type="submit" id="btn-login" class="btn-primary">Iniciar Sesión</button>
            <p id="login-error" class="error-msg"></p>
        </form>
    </div>

    <!-- Scripts en orden de dependencia -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
